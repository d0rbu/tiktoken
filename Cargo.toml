[package]
name = "tiktoken"
version = "0.14.0"
edition = "2024"

[lib]
name = "tiktoken"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = [
    "pyo3",
    "serde_json",
    "serde",
    "sonic-rs",
]
sonic-rs = ["dep:sonic-rs"]
serde = ["dep:serde"]

[dependencies]
pyo3 = { version = "0.29.2", default-features = false, features = [
    "extension-module",
    "macros",
], optional = true }

# tiktoken dependencies
fancy-regex = "0.19.0"
regex = "1.13.1"
# Already enabled transitively by regex/fancy-regex; do not add default features.
regex-automata = { version = "=0.4.18", default-features = false, features = ["meta"] }
rustc-hash = "2"
bstr = "1.13.1"
serde_json = { version = "1.0", features = ["raw_value"], optional = true }
smallvec = { version = "=1.16.4", default-features = false, features = ["union"] }
sonic-rs = { version = "=0.5.10", default-features = false, optional = true }
serde = { version = "1", default-features = false, optional = true }

[dev-dependencies]
serde = { version = "1", default-features = false }
serde_json = { version = "1.0", features = ["raw_value"] }
sonic-rs = { version = "=0.5.10", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.190"
