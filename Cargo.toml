[package]
name = "tiktoken"
version = "0.14.0"
edition = "2024"

[lib]
name = "tiktoken"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = [
    "pyo3",
    "serde_json",
]

[dependencies]
pyo3 = { version = "0.29.2", default-features = false, features = [
    "extension-module",
    "macros",
], optional = true }

# tiktoken dependencies
fancy-regex = "0.19.0"
regex = "1.13.1"
# Already enabled transitively by regex/fancy-regex; do not add default features.
regex-automata = { version = "=0.4.18", default-features = false, features = ["meta"] }
rustc-hash = "2"
bstr = "1.13.1"
serde_json = { version = "1.0", features = ["raw_value"], optional = true }

[dev-dependencies]
serde_json = { version = "1.0", features = ["raw_value"] }
